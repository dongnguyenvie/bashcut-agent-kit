name: Agent kit checks
# Manual only (Actions minutes are limited): run it from the Actions tab, or locally:
#   python3 scripts/check.py && python3 -m unittest discover -s tests && python3 scripts/check_commands.py --reference reference/commands.md
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check.py
      - run: python -m unittest discover -s tests
      - run: python scripts/check_commands.py --reference reference/commands.md
      - run: python scripts/release.py --check
      - name: Require a version bump for skill changes
        if: false  # needs a pull_request base; run check_version.py --base <sha> locally
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_version.py --base "$CHECK_BASE"
