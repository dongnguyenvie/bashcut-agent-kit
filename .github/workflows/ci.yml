name: Agent kit checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check.py
      - run: python -m unittest discover -s tests
      - run: python scripts/check_commands.py --reference reference/commands.md
      - name: Require a version bump for skill changes
        if: github.event_name == 'pull_request'
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_version.py --base "$CHECK_BASE"
